version: '3'
volumes:
  # Dedicated to this project. The old shared external "pgdata" volume is also
  # mounted by ECHOcommunity at postgres:16.8, and a data directory can only
  # belong to one major version, so sharing it made the two projects exclusive.
  plant_api_pgdata:
services:
  db:
    # Matches the production RDS instance (echocommunity-production, 16.13).
    # Must be 12+ regardless: db/structure.sql is dumped by a modern pg_dump
    # and contains "SET default_table_access_method".
    # NOTE: .github/workflows/ci.yml still runs postgres:13.
    image: postgres:16.13
    volumes:
      - plant_api_pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
  pgadmin:
    image: dpage/pgadmin4
    depends_on:
      - db
    ports:
      - "3080:80"
      - "3443:443"
    volumes:
      - ./development/pgadmin/servers.json:/pgadmin4/servers.json
    environment:
      - PGADMIN_DEFAULT_EMAIL=echo@echonet.org
      - PGADMIN_DEFAULT_PASSWORD=password
  # redis:
  #   image: redis:latest
  #   ports:
  #     - "6379:6379"
  mailcatcher:
    image: schickling/mailcatcher
    ports:
      - "1025:1025"
      - "1080:1080"
  # sidekiq:
  #   depends_on:
  #     - db
  #     - redis
  #   build: .
  #   command: bash -c "bundle exec sidekiq -v"
  #   volumes:
  #     - .:/myapp
  #   env_file:
  #     - '.env'
  web:
    build:
      context: .
      target: development
    command: bundle exec rails s -p 3000 -b 0.0.0.0
    volumes:
      - .:/myapp
    ports:
      - "3000:3000"
    tty: true
    stdin_open: true
    depends_on:
      - db
      # - redis
    env_file:
      - '.env'