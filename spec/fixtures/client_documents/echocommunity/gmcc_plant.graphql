query GmccPlant($id: ID!) {
  plant(id: $id) { uuid
scientificName
description
nAccumulationRange
biomassProductionRange
optimalTemperatureRange
optimalRainfallRange
seasonalityDaysRange
optimalAltitudeRange
phRange
earlyGrowthPhase
seedingRate
hasEdibleGreenLeaves
hasEdibleImmatureFruit
hasEdibleMatureFruit
canBeUsedForFodder
edibleGreenLeavesNote
edibleImmatureFruitNote
edibleMatureFruitNote
usedForFodderNote
toleranceNote
antinutrientNote
antinutrients(first: 50) { nodes { name } }
tolerances(first: 50) { nodes { name } }
growthHabits(first: 50) { nodes { name } }
koppenZones(first: 50) { nodes { code name } }
 }
}
