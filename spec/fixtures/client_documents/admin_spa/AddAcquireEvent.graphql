mutation AddAcquireEvent($input: AddAcquireLifeCycleEventInput!) {
    addAcquireEventToSpecimen(input: $input) {
      acquireEvent {
        id
        uuid
        datetime
        notes
        deleted
        condition
        accession
        source
        __typename
      }
      errors {
        field
        message
        code
      }
    }
  }
