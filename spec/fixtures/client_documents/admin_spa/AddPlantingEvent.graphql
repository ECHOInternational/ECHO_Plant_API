mutation AddPlantingEvent($input: AddPlantingLifeCycleEventInput!) {
    addPlantingEventToSpecimen(input: $input) {
      plantingEvent {
        id
        uuid
        datetime
        notes
        deleted
        location {
          id
        }
        quantity
        unit
        betweenRowSpacing
        inRowSpacing
        __typename
      }
      errors {
        field
        message
        code
      }
    }
  }
