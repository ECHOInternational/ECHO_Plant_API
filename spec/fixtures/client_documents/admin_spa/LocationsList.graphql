query LocationsList(
    $first: Int
    $after: String
    $last: Int
    $before: String
    $name: String
    $visibility: Visibility
    $ownedBy: String
    $ownedByOrganizationId: ID
    $sortDirection: SortDirection
  ) {
    locations(
      first: $first
      after: $after
      last: $last
      before: $before
      name: $name
      visibility: $visibility
      ownedBy: $ownedBy
      ownedByOrganizationId: $ownedByOrganizationId
      sortDirection: $sortDirection
    ) {
      totalCount
      pageInfo {
        hasNextPage
        hasPreviousPage
        endCursor
        startCursor
      }
      edges {
        node {
          id
          uuid
          name
          soilQuality
          visibility
          ownedBy
          createdBy
          canEdit
          canDelete
          canRestore
          deletedAt
          ownerOrganization {
            id
            name
            kind
          }
          latitude
          longitude
          area
          slope
          altitude
          averageRainfall
          averageTemperature
          irrigated
          notes
        }
      }
    }
  }
